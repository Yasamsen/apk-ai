name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "HTTPS URL to load in WebView"
        required: true
        type: string
      app_name:
        description: "Android app display name"
        required: true
        type: string
      package_name:
        description: "Android package ID"
        required: true
        type: string
      icon_url:
        description: "Optional HTTPS URL of PNG/JPG launcher icon"
        required: false
        type: string
      icon_data:
        description: "Optional compressed JPEG data URL (preferred when uploaded)"
        required: false
        type: string
      ai_endpoint:
        description: "Optional HTTPS URL of the AI chat proxy (empty = no floating AI assistant)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate inputs
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          ICON_URL: ${{ inputs.icon_url }}
          ICON_DATA: ${{ inputs.icon_data }}
          AI_ENDPOINT: ${{ inputs.ai_endpoint }}
        run: |
          python - <<'PY'
          import os, re
          from urllib.parse import urlparse
          u = urlparse(os.environ["WEBSITE_URL"])
          if u.scheme != "https" or not u.hostname or u.username or u.password:
              raise SystemExit("URL must be HTTPS and contain no credentials")
          name = os.environ["APP_NAME"]
          if not name or len(name) > 40 or any(ord(c) < 32 or c in "<>" for c in name):
              raise SystemExit("Invalid app name")
          if not re.fullmatch(r"[a-z][a-z0-9]*(\.[a-z][a-z0-9]*){1,6}", os.environ["PACKAGE_NAME"]):
              raise SystemExit("Invalid package name")
          if os.environ.get("ICON_URL"):
              icon = urlparse(os.environ["ICON_URL"])
              if icon.scheme != "https" or not icon.hostname or icon.username or icon.password:
                  raise SystemExit("Icon URL must be HTTPS without credentials")
          if len(os.environ.get("ICON_DATA", "")) > 45000:
              raise SystemExit("Icon data is too large")
          ep = os.environ.get("AI_ENDPOINT", "")
          if ep:
              e = urlparse(ep)
              if e.scheme != "https" or not e.hostname or e.username or e.password or re.search(r'["\\\s<>]', ep):
                  raise SystemExit("AI endpoint must be a clean HTTPS URL")
          PY

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Avoid setup-android action defaulting to the obsolete "tools" package.
      - name: Locate Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK_ROOT"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK directory not found on runner."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Create minimal Android project
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          AI_ENDPOINT: ${{ inputs.ai_endpoint }}
        run: |
          mkdir -p app/src/main/java
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi
          python - <<'PY'
          import os, pathlib, re
          pkg = os.environ["PACKAGE_NAME"]
          path = pathlib.Path("app/src/main/java") / pathlib.Path(pkg.replace(".", "/"))
          path.mkdir(parents=True, exist_ok=True)
          (path / "MainActivity.java").write_text(r'''package __PACKAGE__;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.view.ViewGroup;
          import android.view.KeyEvent;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.webkit.PermissionRequest;
          import android.webkit.GeolocationPermissions;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient.FileChooserParams;
          import android.content.Intent;
          import android.net.Uri;
          import android.app.DownloadManager;
          import android.webkit.CookieManager;
          import android.webkit.URLUtil;
          import android.os.Environment;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.webkit.JavascriptInterface;
          import android.util.Base64;
          import android.content.ContentValues;
          import android.provider.MediaStore;
          import java.io.OutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.EditText;
          import android.widget.TextView;
          import android.view.View;
          import android.view.MotionEvent;
          import android.view.Gravity;
          import android.view.ViewConfiguration;
          import android.view.inputmethod.InputMethodManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.text.InputType;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.BufferedReader;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.ArrayList;

          public class MainActivity extends Activity {
              private WebView webView;
              private PermissionRequest pendingWebPermission;
              private GeolocationPermissions.Callback pendingGeoCallback;
              private String pendingGeoOrigin;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_CODE = 7003;
              private static final int WEB_PERMISSION_CODE = 7001;
              private static final int GEO_PERMISSION_CODE = 7002;
              private String startUrl = "__URL__";
              private static final String AI_ENDPOINT = "__AI_ENDPOINT__";
              private View aiFab;
              private LinearLayout aiPanel;
              private LinearLayout aiMessages;
              private ScrollView aiScroll;
              private EditText aiInput;
              private TextView aiSendButton;
              private boolean aiBusy = false;
              private final ArrayList<String[]> aiHistory = new ArrayList<>();
              private final class BlobDownloadBridge {
                  @JavascriptInterface public void saveBlob(String dataUrl, String requestedName, String requestedMime) {
                      new Thread(() -> {
                          try {
                              String[] parts = dataUrl.split(",", 2);
                              if (parts.length != 2) throw new IOException("Data file tidak valid");
                              byte[] bytes = Base64.decode(parts[1], Base64.DEFAULT);
                              String name = requestedName == null ? "download" : requestedName.replaceAll("[\\/:*?\"<>|]", "_").trim();
                              if (name.isEmpty()) name = "download";
                              final String finalName = name;
                              String mime = requestedMime == null || requestedMime.isEmpty() ? "application/octet-stream" : requestedMime;
                              Uri savedUri = null;
                              if (Build.VERSION.SDK_INT >= 29) {
                                  ContentValues values = new ContentValues();
                                  values.put(MediaStore.Downloads.DISPLAY_NAME, name);
                                  values.put(MediaStore.Downloads.MIME_TYPE, mime);
                                  values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                                  values.put(MediaStore.Downloads.IS_PENDING, 1);
                                  savedUri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                                  if (savedUri == null) throw new IOException("Tidak bisa membuat file di folder Download");
                                  try (OutputStream out = getContentResolver().openOutputStream(savedUri)) {
                                      if (out == null) throw new IOException("Tidak bisa menulis file");
                                      out.write(bytes);
                                  }
                                  ContentValues done = new ContentValues(); done.put(MediaStore.Downloads.IS_PENDING, 0);
                                  getContentResolver().update(savedUri, done, null, null);
                              } else {
                                  File dir = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);
                                  if (dir == null) throw new IOException("Folder download tidak tersedia");
                                  if (!dir.exists()) dir.mkdirs();
                                  File file = new File(dir, name);
                                  try (FileOutputStream out = new FileOutputStream(file)) { out.write(bytes); }
                              }
                              runOnUiThread(() -> android.widget.Toast.makeText(MainActivity.this, "Download selesai: " + finalName, android.widget.Toast.LENGTH_LONG).show());
                          } catch (Exception e) {
                              android.util.Log.e("Web2APK", "Blob download gagal", e);
                              String reason = e.getMessage() == null ? "gagal menyimpan file" : e.getMessage();
                              runOnUiThread(() -> android.widget.Toast.makeText(MainActivity.this, "Download gagal: " + reason, android.widget.Toast.LENGTH_LONG).show());
                          }
                      }).start();
                  }
              }
              @Override public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  // Gunakan WebView langsung tanpa SwipeRefreshLayout agar swipe vertikal
                  // untuk scroll tidak dianggap sebagai perintah reload halaman.
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setGeolocationEnabled(true);
                  webView.addJavascriptInterface(new BlobDownloadBridge(), "AndroidBlobDownload");
                  webView.setWebViewClient(new WebViewClient() {
                      @Override public void onPageStarted(WebView view, String url, android.graphics.Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                      }
                      @Override public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                      }
                      @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if ("app".equals(request.getUrl().getScheme()) && "retry".equals(request.getUrl().getHost())) {
                              view.loadUrl(startUrl);
                              return true;
                          }
                          return false;
                      }
                      @Override public void onReceivedError(WebView view, WebResourceRequest request, android.webkit.WebResourceError error) {
                          super.onReceivedError(view, request, error);
                          if (request.isForMainFrame()) showOfflinePage();
                      }
                      @Override public void onReceivedHttpError(WebView view, WebResourceRequest request, android.webkit.WebResourceResponse response) {
                          super.onReceivedHttpError(view, request, response);
                          if (request.isForMainFrame() && response.getStatusCode() >= 500) showOfflinePage();
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = callback;
                          try {
                              Intent intent = params != null ? params.createIntent() : new Intent(Intent.ACTION_GET_CONTENT);
                              intent.addCategory(Intent.CATEGORY_OPENABLE);
                              if (intent.getType() == null || intent.getType().equals("*/*")) intent.setType("*/*");
                              startActivityForResult(Intent.createChooser(intent, "Pilih file atau foto"), FILE_CHOOSER_CODE);
                              return true;
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                      }
                      @Override public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (Build.VERSION.SDK_INT < 23) { request.grant(request.getResources()); return; }
                              java.util.ArrayList<String> needed = new java.util.ArrayList<>();
                              for (String resource : request.getResources()) {
                                  if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource) && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) needed.add(Manifest.permission.CAMERA);
                                  if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource) && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) needed.add(Manifest.permission.RECORD_AUDIO);
                              }
                              if (needed.isEmpty()) request.grant(request.getResources());
                              else { pendingWebPermission = request; requestPermissions(needed.toArray(new String[0]), WEB_PERMISSION_CODE); }
                          });
                      }
                      @Override public void onPermissionRequestCanceled(PermissionRequest request) {
                          if (pendingWebPermission == request) pendingWebPermission = null;
                      }
                      @Override public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          if (Build.VERSION.SDK_INT < 23 || (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED)) {
                              callback.invoke(origin, true, false);
                          } else {
                              pendingGeoOrigin = origin; pendingGeoCallback = callback;
                              requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, GEO_PERMISSION_CODE);
                          }
                      }
                  });
                  // Handle website downloads inside Android instead of opening an external browser.
                  webView.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      try {
                          if (url != null && url.startsWith("blob:")) {
                              String safeName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                              String jsUrl = org.json.JSONObject.quote(url);
                              String jsName = org.json.JSONObject.quote(safeName);
                              String jsMime = org.json.JSONObject.quote(mimeType == null ? "application/octet-stream" : mimeType);
                              String script = "(async function(){try{const r=await fetch(" + jsUrl + ");const b=await r.blob();const reader=new FileReader();reader.onloadend=function(){AndroidBlobDownload.saveBlob(reader.result," + jsName + ",b.type||" + jsMime + ");};reader.readAsDataURL(b);}catch(e){console.error('Blob download failed',e);}})();";
                              webView.evaluateJavascript(script, null);
                              return;
                          }
                          DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                          String cookie = CookieManager.getInstance().getCookie(url);
                          if (cookie != null && !cookie.isEmpty()) request.addRequestHeader("Cookie", cookie);
                          if (userAgent != null && !userAgent.isEmpty()) request.addRequestHeader("User-Agent", userAgent);
                          request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          request.setAllowedOverMetered(true);
                          request.setAllowedOverRoaming(true);
                          request.setTitle(URLUtil.guessFileName(url, contentDisposition, mimeType));
                          request.setDescription("Mengunduh file...");
                          request.setMimeType(mimeType != null ? mimeType : "application/octet-stream");
                          // Simpan ke folder Download publik agar file terlihat di pengelola file.
                          // DownloadManager menangani transfer; jangan meminta izin storage runtime pada Android 10.
                          String fileName = URLUtil.guessFileName(url, contentDisposition, mimeType);
                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, fileName);
                          DownloadManager manager = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                          if (manager != null) {
                              long downloadId = manager.enqueue(request);
                              android.widget.Toast.makeText(MainActivity.this, "Download dimulai: " + fileName, android.widget.Toast.LENGTH_SHORT).show();
                          } else {
                              android.widget.Toast.makeText(MainActivity.this, "Download tidak tersedia di perangkat ini", android.widget.Toast.LENGTH_LONG).show();
                          }
                      } catch (Exception e) {
                          android.util.Log.e("Web2APK", "Download gagal: " + url, e);
                          String reason = e.getMessage() != null ? e.getMessage() : e.getClass().getSimpleName();
                          android.widget.Toast.makeText(MainActivity.this, "Gagal memulai download: " + reason, android.widget.Toast.LENGTH_LONG).show();
                      }
                  });
                  FrameLayout rootLayout = new FrameLayout(this);
                  rootLayout.addView(webView, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(rootLayout);
                  if (AI_ENDPOINT != null && !AI_ENDPOINT.isEmpty()) setupAssistant(rootLayout);
                  if (savedInstanceState != null) webView.restoreState(savedInstanceState);
                  else webView.loadUrl(startUrl);
              }
              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_CODE && filePathCallback != null) {
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null) {
                          if (data.getClipData() != null) {
                              android.content.ClipData clip = data.getClipData();
                              results = new Uri[clip.getItemCount()];
                              for (int i = 0; i < clip.getItemCount(); i++) results[i] = clip.getItemAt(i).getUri();
                          } else if (data.getData() != null) results = new Uri[]{data.getData()};
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }
              @Override public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == WEB_PERMISSION_CODE && pendingWebPermission != null) {
                      boolean allowed = true;
                      for (String resource : pendingWebPermission.getResources()) {
                          if (PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource) && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) allowed = false;
                          if (PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource) && checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) allowed = false;
                      }
                      if (allowed) pendingWebPermission.grant(pendingWebPermission.getResources()); else pendingWebPermission.deny();
                      pendingWebPermission = null;
                  } else if (requestCode == GEO_PERMISSION_CODE && pendingGeoCallback != null) {
                      boolean allowed = checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED;
                      pendingGeoCallback.invoke(pendingGeoOrigin, allowed, false);
                      pendingGeoCallback = null; pendingGeoOrigin = null;
                  }
              }
              // ===== Asisten AI melayang =====
              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable rounded(String color, int radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(Color.parseColor(color));
                  g.setCornerRadius(dp(radiusDp));
                  return g;
              }

              private void setupAssistant(final FrameLayout root) {
                  // --- Tombol melayang (bisa digeser, ketuk untuk membuka) ---
                  final TextView fab = new TextView(this);
                  fab.setText("AI");
                  fab.setTextColor(Color.parseColor("#05281D"));
                  fab.setTextSize(16);
                  fab.setTypeface(null, Typeface.BOLD);
                  fab.setGravity(Gravity.CENTER);
                  GradientDrawable fabBg = new GradientDrawable();
                  fabBg.setShape(GradientDrawable.OVAL);
                  fabBg.setColor(Color.parseColor("#57D3A5"));
                  fabBg.setStroke(dp(2), Color.WHITE);
                  fab.setBackground(fabBg);
                  if (Build.VERSION.SDK_INT >= 21) fab.setElevation(dp(8));
                  final int fabSize = dp(56);
                  root.addView(fab, new FrameLayout.LayoutParams(fabSize, fabSize, Gravity.TOP | Gravity.START));
                  aiFab = fab;
                  root.post(() -> {
                      fab.setX(root.getWidth() - fabSize - dp(8));
                      fab.setY(root.getHeight() * 0.65f);
                  });
                  fab.setOnClickListener(v -> openAssistant());
                  final int slop = ViewConfiguration.get(this).getScaledTouchSlop();
                  fab.setOnTouchListener(new View.OnTouchListener() {
                      float downX, downY, startX, startY;
                      boolean dragging;
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  downX = e.getRawX(); downY = e.getRawY();
                                  startX = v.getX(); startY = v.getY();
                                  dragging = false;
                                  v.animate().cancel();
                                  return true;
                              case MotionEvent.ACTION_MOVE: {
                                  float dx = e.getRawX() - downX, dy = e.getRawY() - downY;
                                  if (!dragging && Math.hypot(dx, dy) > slop) dragging = true;
                                  if (dragging) {
                                      v.setX(Math.max(0, Math.min(root.getWidth() - v.getWidth(), startX + dx)));
                                      v.setY(Math.max(0, Math.min(root.getHeight() - v.getHeight(), startY + dy)));
                                  }
                                  return true;
                              }
                              case MotionEvent.ACTION_UP:
                                  if (dragging) {
                                      boolean left = v.getX() + v.getWidth() / 2f < root.getWidth() / 2f;
                                      float target = left ? dp(8) : root.getWidth() - v.getWidth() - dp(8);
                                      v.animate().x(target).setDuration(180).start();
                                  } else {
                                      v.performClick();
                                  }
                                  return true;
                              case MotionEvent.ACTION_CANCEL:
                                  return true;
                          }
                          return false;
                      }
                  });

                  // --- Panel tanya jawab ---
                  aiPanel = new LinearLayout(this);
                  aiPanel.setOrientation(LinearLayout.VERTICAL);
                  aiPanel.setBackground(rounded("#111B2E", 18));
                  aiPanel.setClickable(true); // cegah sentuhan tembus ke WebView
                  aiPanel.setVisibility(View.GONE);
                  if (Build.VERSION.SDK_INT >= 21) aiPanel.setElevation(dp(16));
                  FrameLayout.LayoutParams panelLp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT);
                  panelLp.setMargins(dp(10), dp(48), dp(10), dp(10));
                  root.addView(aiPanel, panelLp);

                  // Header
                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.HORIZONTAL);
                  header.setGravity(Gravity.CENTER_VERTICAL);
                  header.setPadding(dp(16), dp(10), dp(8), dp(10));
                  TextView title = new TextView(this);
                  title.setText("Asisten AI");
                  title.setTextColor(Color.parseColor("#EEF4FF"));
                  title.setTextSize(16);
                  title.setTypeface(null, Typeface.BOLD);
                  header.addView(title, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                  TextView clear = new TextView(this);
                  clear.setText("Hapus");
                  clear.setTextColor(Color.parseColor("#A8B6CA"));
                  clear.setPadding(dp(12), dp(8), dp(12), dp(8));
                  clear.setOnClickListener(v -> resetChat());
                  header.addView(clear);
                  TextView close = new TextView(this);
                  close.setText("\u2715");
                  close.setTextColor(Color.parseColor("#EEF4FF"));
                  close.setTextSize(18);
                  close.setPadding(dp(12), dp(6), dp(12), dp(6));
                  close.setOnClickListener(v -> closeAssistant());
                  header.addView(close);
                  aiPanel.addView(header);

                  // Daftar pesan
                  aiScroll = new ScrollView(this);
                  aiMessages = new LinearLayout(this);
                  aiMessages.setOrientation(LinearLayout.VERTICAL);
                  aiMessages.setPadding(dp(12), dp(4), dp(12), dp(12));
                  aiScroll.addView(aiMessages, new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT));
                  aiPanel.addView(aiScroll, new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));

                  // Kolom ketik
                  LinearLayout inputRow = new LinearLayout(this);
                  inputRow.setOrientation(LinearLayout.HORIZONTAL);
                  inputRow.setGravity(Gravity.CENTER_VERTICAL);
                  inputRow.setPadding(dp(10), dp(8), dp(10), dp(10));
                  aiInput = new EditText(this);
                  aiInput.setHint("Ketik pertanyaan...");
                  aiInput.setHintTextColor(Color.parseColor("#7F8CA3"));
                  aiInput.setTextColor(Color.parseColor("#EEF4FF"));
                  aiInput.setTextSize(15);
                  aiInput.setBackground(rounded("#0A1221", 12));
                  aiInput.setPadding(dp(12), dp(10), dp(12), dp(10));
                  aiInput.setMaxLines(4);
                  aiInput.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_MULTI_LINE
                          | InputType.TYPE_TEXT_FLAG_CAP_SENTENCES);
                  inputRow.addView(aiInput, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));
                  aiSendButton = new TextView(this);
                  aiSendButton.setText("Kirim");
                  aiSendButton.setTextColor(Color.parseColor("#05281D"));
                  aiSendButton.setTypeface(null, Typeface.BOLD);
                  aiSendButton.setGravity(Gravity.CENTER);
                  aiSendButton.setBackground(rounded("#57D3A5", 12));
                  aiSendButton.setPadding(dp(16), dp(10), dp(16), dp(10));
                  aiSendButton.setOnClickListener(v -> sendQuestion());
                  LinearLayout.LayoutParams sendLp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  sendLp.leftMargin = dp(8);
                  inputRow.addView(aiSendButton, sendLp);
                  aiPanel.addView(inputRow);

                  // Tinggi panel menyesuaikan layar & keyboard (adjustResize)
                  root.addOnLayoutChangeListener((v, l, t, r, b, ol, ot, or, ob) -> {
                      if (aiPanel.getVisibility() != View.VISIBLE) return;
                      int top = Math.max(dp(48), root.getHeight() - dp(480));
                      FrameLayout.LayoutParams lp = (FrameLayout.LayoutParams) aiPanel.getLayoutParams();
                      if (lp.topMargin != top) { lp.topMargin = top; aiPanel.setLayoutParams(lp); }
                  });

                  resetChat();
              }

              private void resetChat() {
                  aiHistory.clear();
                  aiMessages.removeAllViews();
                  addBubble("Halo! Tanyakan apa saja, saya akan bantu menjawab.", false);
              }

              private void openAssistant() {
                  FrameLayout.LayoutParams lp = (FrameLayout.LayoutParams) aiPanel.getLayoutParams();
                  lp.topMargin = Math.max(dp(48), ((View) aiPanel.getParent()).getHeight() - dp(480));
                  aiPanel.setLayoutParams(lp);
                  aiPanel.setVisibility(View.VISIBLE);
                  aiFab.setVisibility(View.GONE);
                  aiInput.requestFocus();
                  aiInput.post(() -> {
                      InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                      if (imm != null) imm.showSoftInput(aiInput, InputMethodManager.SHOW_IMPLICIT);
                  });
                  scrollChatDown();
              }

              private void closeAssistant() {
                  InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                  if (imm != null) imm.hideSoftInputFromWindow(aiInput.getWindowToken(), 0);
                  aiPanel.setVisibility(View.GONE);
                  aiFab.setVisibility(View.VISIBLE);
              }

              private void scrollChatDown() {
                  aiScroll.post(() -> aiScroll.fullScroll(View.FOCUS_DOWN));
              }

              private TextView addBubble(String text, boolean fromUser) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextSize(14.5f);
                  tv.setTextIsSelectable(true); // tekan lama untuk menyalin jawaban
                  tv.setTextColor(Color.parseColor(fromUser ? "#05281D" : "#EEF4FF"));
                  tv.setBackground(rounded(fromUser ? "#57D3A5" : "#1D2B44", 14));
                  tv.setPadding(dp(12), dp(8), dp(12), dp(8));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.gravity = fromUser ? Gravity.END : Gravity.START;
                  lp.topMargin = dp(6);
                  if (fromUser) lp.leftMargin = dp(40); else lp.rightMargin = dp(40);
                  aiMessages.addView(tv, lp);
                  scrollChatDown();
                  return tv;
              }

              private void sendQuestion() {
                  if (aiBusy) return;
                  final String question = aiInput.getText().toString().trim();
                  if (question.isEmpty()) return;
                  aiInput.setText("");
                  addBubble(question, true);
                  aiHistory.add(new String[]{"user", question});
                  while (aiHistory.size() > 12) aiHistory.remove(0);
                  final TextView pending = addBubble("Sedang berpikir...", false);
                  aiBusy = true;
                  aiSendButton.setAlpha(0.5f);

                  final JSONArray messages = new JSONArray();
                  try {
                      for (String[] m : aiHistory) messages.put(new JSONObject().put("role", m[0]).put("content", m[1]));
                  } catch (Exception ignored) { }

                  new Thread(() -> {
                      String reply;
                      boolean ok = false;
                      HttpURLConnection conn = null;
                      try {
                          conn = (HttpURLConnection) new URL(AI_ENDPOINT).openConnection();
                          conn.setRequestMethod("POST");
                          conn.setConnectTimeout(15000);
                          conn.setReadTimeout(60000);
                          conn.setDoOutput(true);
                          conn.setRequestProperty("Content-Type", "application/json; charset=utf-8");
                          byte[] body = new JSONObject().put("messages", messages).toString().getBytes("UTF-8");
                          try (OutputStream out = conn.getOutputStream()) { out.write(body); }
                          int code = conn.getResponseCode();
                          InputStream in = (code >= 200 && code < 300) ? conn.getInputStream() : conn.getErrorStream();
                          JSONObject json = new JSONObject(readAll(in));
                          if (code >= 200 && code < 300 && json.has("reply")) {
                              reply = json.getString("reply");
                              ok = true;
                          } else {
                              reply = json.optString("error", "Gagal memproses (HTTP " + code + ").");
                          }
                      } catch (org.json.JSONException e) {
                          reply = "Server AI mengirim respons yang tidak valid. Coba lagi.";
                      } catch (Exception e) {
                          android.util.Log.e("Web2APK", "AI gagal", e);
                          reply = "Tidak bisa terhubung ke server AI. Periksa koneksi internet.";
                      } finally {
                          if (conn != null) conn.disconnect();
                      }
                      final String finalReply = reply;
                      final boolean finalOk = ok;
                      runOnUiThread(() -> {
                          pending.setText(finalReply);
                          if (finalOk) {
                              aiHistory.add(new String[]{"assistant", finalReply});
                          } else if (!aiHistory.isEmpty()) {
                              aiHistory.remove(aiHistory.size() - 1); // buang pertanyaan yang gagal
                          }
                          aiBusy = false;
                          aiSendButton.setAlpha(1f);
                          scrollChatDown();
                      });
                  }).start();
              }

              private String readAll(InputStream in) throws IOException {
                  if (in == null) return "";
                  try (BufferedReader r = new BufferedReader(new InputStreamReader(in, "UTF-8"))) {
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = r.readLine()) != null) sb.append(line).append('\n');
                      return sb.toString();
                  }
              }
              // ===== Akhir asisten AI =====

